name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AC1FD8: ${{ secrets.AC1FD8 }}
          B617E1: ${{ secrets.B617E1 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AC1FD8', '')
          k2 = os.environ.get('B617E1', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- f2c01ead8d1d73ab07c9 -->', k1) if k1 else txt
          out = out.replace('<!-- a8c86bdc253748b4b1c574041ae7dd79b64624d52eee1b -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
